[package]
name = "wiilandd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "WiiLand Wii Remote input daemon"

[lib]
name = "wiilandd"
path = "src/lib.rs"

[[bin]]
name = "wiilandd"
path = "src/main.rs"

[[bin]]
name = "wiilandd-hardware-report"
path = "src/bin/wiilandd-hardware-report.rs"

[dependencies]
libc.workspace = true
wiiland-core = { path = "../wiiland-core" }
wiiland-ipc = { path = "../wiiland-ipc" }
wiiland-hid = { path = "../wiiland-hid" }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
wiiland-output-service = { path = "../wiiland-output-service" }
[dev-dependencies]
tempfile.workspace = true
