name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust and native integration dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            groff \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config \
            udev \
            weston \
            xauth \
            xvfb \
            xz-utils
          rustup toolchain install 1.98.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.98.0
          test "$(rustc --version | cut -d' ' -f2)" = 1.98.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check the locked workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run strict clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run locked workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Smoke test CLI and daemon commands
        run: |
          set -eu
          daemon="$PWD/target/debug/wiilandd"
          report="$PWD/target/debug/wiilandd-hardware-report"
          tui="$PWD/target/debug/wiiland-show"
          dump="$PWD/target/debug/wiiland-dump"
          "$daemon" --help >/dev/null
          "$daemon" --no-config --self-test
          "$daemon" --no-config --check-config >/dev/null
          "$daemon" --no-config --axis-map >/dev/null
          "$daemon" --no-config --validation-checklist >/dev/null
          "$daemon" --no-config --doctor >/dev/null
          "$tui" --help >/dev/null
          "$dump" --help >/dev/null
          WIILANDD="$daemon" WIILAND_REPO_DIR="$PWD" \
            "$report" --help >/dev/null
          WIILANDD="$daemon" WIILAND_REPO_DIR="$PWD" \
            "$report" >"$RUNNER_TEMP/wiiland-hardware-report"
          grep -F 'report.schema.version=2' \
            "$RUNNER_TEMP/wiiland-hardware-report" >/dev/null
          grep -F 'report.status=ok' \
            "$RUNNER_TEMP/wiiland-hardware-report" >/dev/null

      - name: Smoke the real IPC socket and Rust client
        run: |
          set -euo pipefail
          daemon="$PWD/target/debug/wiilandd"
          runtime="$RUNNER_TEMP/wiiland-ipc-runtime"
          socket="$runtime/wiiland-ipc.sock"
          log="$RUNNER_TEMP/wiiland-ipc-daemon.log"
          output="$RUNNER_TEMP/wiiland-ipc-status"
          daemon_pid=
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            if [ -n "$daemon_pid" ] && kill -0 "$daemon_pid" 2>/dev/null; then
              kill "$daemon_pid" 2>/dev/null || :
              wait "$daemon_pid" 2>/dev/null || :
            fi
            if [ "$status" -ne 0 ]; then
              cat "$log"
            fi
            rm -rf "$runtime"
            rm -f "$log" "$output"
            exit "$status"
          }
          trap cleanup EXIT INT TERM
          rm -rf "$runtime"
          rm -f "$log" "$output"
          umask 077
          mkdir "$runtime"
          chmod 700 "$runtime"
          : >"$log"
          "$daemon" \
            --no-config \
            --dry-run \
            --ipc-socket "$socket" \
            >"$log" 2>&1 &
          daemon_pid=$!
          ready=
          for _ in $(seq 1 100); do
            if ! kill -0 "$daemon_pid" 2>/dev/null; then
              echo "wiilandd exited before its IPC status became available" >&2
              exit 1
            fi
            if cargo run --locked -p wiiland-ipc --example status -- \
              --socket "$socket" >"$output" 2>&1; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [ -z "$ready" ]; then
            echo "timed out waiting for wiilandd IPC status" >&2
            cat "$output" >&2
            exit 1
          fi
          test -S "$socket"
          test -n "$daemon_pid"
          kill -0 "$daemon_pid"
          cat "$output"
          grep -E '^daemon_version=[^[:space:]]+$' "$output" >/dev/null
          grep -E '^pid=[0-9]+$' "$output" >/dev/null
          grep -Fx 'device_count=0' "$output" >/dev/null
          grep -Fx 'dry_run=true' "$output" >/dev/null
          grep -Fx "socket_path=$socket" "$output" >/dev/null
          kill -0 "$daemon_pid"

      - name: Enforce no C ABI artifacts
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/wiiland-cargo-metadata.json"
          cargo metadata --format-version 1 --no-deps --locked >"$metadata"
          jq -e \
            'all(.packages[] .targets[] .crate_types[];
              . != "cdylib" and . != "staticlib")' \
            "$metadata" >/dev/null

      - name: Build the release workspace
        run: cargo xtask build --release --features gui,tui,integrations


      - name: Smoke GUI under X11
        run: |
          set -eu
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            env \
              WINIT_UNIX_BACKEND=x11 \
              WIILAND_CONFIG_SMOKE_TEST=1 \
              "$PWD/target/release/wiiland-config"

      - name: Smoke GUI with the headless Wayland backend
        run: |
          set -eu
          runtime="$RUNNER_TEMP/wiiland-wayland-runtime"
          socket=wiiland-wayland-0
          log="$RUNNER_TEMP/wiiland-weston.log"
          weston_pid=
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            if [ -n "$weston_pid" ] && kill -0 "$weston_pid" 2>/dev/null; then
              kill "$weston_pid" 2>/dev/null || :
              wait "$weston_pid" 2>/dev/null || :
            fi
            rm -rf "$runtime"
            exit "$status"
          }
          trap cleanup EXIT INT TERM
          umask 077
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          export XDG_RUNTIME_DIR="$runtime"
          export WAYLAND_DISPLAY="$socket"
          weston \
            --backend=headless \
            --renderer=pixman \
            --shell=kiosk \
            --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 \
            >"$log" 2>&1 &
          weston_pid=$!
          for _ in $(seq 1 100); do
            [ -S "$runtime/$socket" ] && break
            if ! kill -0 "$weston_pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 0.1
          done
          test -S "$runtime/$socket"
          env \
            DISPLAY= \
            WINIT_UNIX_BACKEND=wayland \
            XDG_SESSION_TYPE=wayland \
            WIILAND_CONFIG_SMOKE_TEST=1 \
            "$PWD/target/release/wiiland-config"

      - name: Exercise real uinput when available
        run: |
          set -eu
          sudo modprobe uinput 2>/dev/null || :
          if test -r /dev/uinput && test -w /dev/uinput; then
            WIILAND_REAL_UINPUT=1 cargo test --locked -p wiilandd \
              --test uinput_real -- \
              --ignored --exact \
              real_uinput_creates_emits_and_destroys_both_device_kinds
            echo "uinput: pass (real create/emit/sync/destroy test completed)"
          elif test -e /dev/uinput; then
            echo "uinput: skip (device exists but is not readable and writable)"
          else
            echo "uinput: skip (kernel module or device unavailable)"
          fi

      - name: Stage installation and validate assets
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/wiiland-stage"
          cargo xtask install --release --destdir "$stage" \
            --prefix /usr \
            --sysconfdir /etc \
            --with-udev-rules-dir /usr/lib/udev/rules.d \
            --with-systemd-user-unit-dir /usr/lib/systemd/user \
            --with-xorg-conf-dir /usr/share/X11/xorg.conf.d \
            --features gui,tui,integrations
          bindir="$stage/usr/bin"
          expected_bins="$RUNNER_TEMP/wiiland-staged-bins.expected"
          actual_bins="$RUNNER_TEMP/wiiland-staged-bins.actual"
          printf '%s\n' \
            wiiland-config \
            wiilandd \
            wiilandd-hardware-report \
            wiiland-show \
            | sort >"$expected_bins"
          find "$bindir" -mindepth 1 -maxdepth 1 -printf '%f\n' \
            | sort >"$actual_bins"
          if ! diff -u "$expected_bins" "$actual_bins"; then
            echo "staged binary directory must contain exactly the four manifest executables" >&2
            exit 1
          fi
          while IFS= read -r binary; do
            test -f "$bindir/$binary"
            test -x "$bindir/$binary"
          done <"$expected_bins"
          forbidden="$(find "$stage" \( -type f -o -type l \) \( \
            -name '*.h' -o \
            -name '*.a' -o \
            -name '*.so' -o \
            -name '*.so.*' -o \
            -name '*.pc' -o \
            -name '*.rlib' \
          \) -print -quit)"
          if test -n "$forbidden"; then
            find "$stage" \( -type f -o -type l \) \( \
              -name '*.h' -o \
              -name '*.a' -o \
              -name '*.so' -o \
              -name '*.so.*' -o \
              -name '*.pc' -o \
              -name '*.rlib' \
            \) -print >&2
            exit 1
          fi
          for rule in "$stage/usr/lib/udev/rules.d/"*.rules; do
            test -s "$rule"
            udevadm verify "$rule"
          done
          desktop="$stage/usr/share/applications/io.github.philosophimoonbeam.wiiland-config.desktop"
          desktop-file-validate "$desktop"
          docdir="$stage/usr/share/doc/wiiland"
          test -f "$docdir/LICENSE"
          test -f "$docdir/COPYING"
          expected_man1="$RUNNER_TEMP/wiiland-staged-man1.expected"
          actual_man1="$RUNNER_TEMP/wiiland-staged-man1.actual"
          printf '%s\n' \
            wiiland-config.1 \
            wiiland-show.1 \
            wiilandd.1 \
            | sort >"$expected_man1"
          find "$stage/usr/share/man/man1" -mindepth 1 -maxdepth 1 -printf '%f\n' \
            | sort >"$actual_man1"
          if ! diff -u "$expected_man1" "$actual_man1"; then
            echo "staged man1 directory must contain exactly the three expected manuals" >&2
            exit 1
          fi
          expected_man7="$RUNNER_TEMP/wiiland-staged-man7.expected"
          actual_man7="$RUNNER_TEMP/wiiland-staged-man7.actual"
          printf '%s\n' wiiland.7 >"$expected_man7"
          find "$stage/usr/share/man/man7" -mindepth 1 -maxdepth 1 -printf '%f\n' \
            | sort >"$actual_man7"
          if ! diff -u "$expected_man7" "$actual_man7"; then
            echo "staged man7 directory must contain exactly the expected manual" >&2
            exit 1
          fi
          for manual in "$stage/usr/share/man/man1/"*.1 \
              "$stage/usr/share/man/man7/"*.7; do
            test -s "$manual"
            groff -man -Tutf8 "$manual" >/dev/null
          done
          test -s "$stage/usr/lib/systemd/user/wiilandd.service"
          test -s "$stage/usr/share/X11/xorg.conf.d/50-xorg-fix-wiiland.conf"
          test -s "$stage/usr/share/icons/hicolor/scalable/apps/io.github.philosophimoonbeam.wiiland.svg"
          "$stage/usr/bin/wiilandd" --no-config --self-test
          "$stage/usr/bin/wiiland-show" --help >/dev/null
          WIILANDD="$stage/usr/bin/wiilandd" WIILAND_REPO_DIR="$PWD" \
            "$stage/usr/bin/wiilandd-hardware-report" --help >/dev/null

      - name: Verify ownership-safe uninstall
        run: |
          set -eu
          stage="$RUNNER_TEMP/wiiland-stage"
          keep="$stage/usr/bin/ci-unowned-file"
          changed="$stage/usr/share/man/man7/wiiland.7"
          printf '%s\n' 'not owned by xtask' >"$keep"
          printf '%s\n' '.ci-local-edit' >>"$changed"
          cargo xtask uninstall --destdir "$stage" \
            --prefix /usr --sysconfdir /etc
          test -e "$keep"
          test -e "$changed"
          test ! -e "$stage/usr/bin/wiilandd"
          test ! -e "$stage/usr/bin/wiiland-config"
          test ! -e "$stage/etc/wiiland/.xtask-install"

      - name: Create and verify deterministic source archives
        run: |
          set -eu
          first="$RUNNER_TEMP/wiiland-2-first.tar.xz"
          second="$RUNNER_TEMP/wiiland-2-second.tar.xz"
          cargo xtask dist --output "$first"
          cargo xtask dist --output "$second"
          cmp --silent "$first" "$second"
          cargo xtask verify-dist "$first"

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.98 x64 MSVC toolchain
        shell: pwsh
        run: |
          $toolchain = '1.98.0-x86_64-pc-windows-msvc'
          rustup toolchain install $toolchain --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default $toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -notmatch '^rustc 1\.98\.0(?:\s|$)') {
            throw "Expected Rust 1.98.0, got: $version"
          }
          $rustHostLine = rustc -vV | Select-String '^host: '
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $rustHostLine -or $rustHostLine.Line -ne 'host: x86_64-pc-windows-msvc') {
            throw "Expected x86_64-pc-windows-msvc, got: $rustHostLine"
          }

      - name: Check the locked Windows workspace
        shell: pwsh
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run strict Windows clippy
        shell: pwsh
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run locked Windows workspace tests
        shell: pwsh
        run: cargo test --workspace --all-features --locked

      - name: Build the real daemon and IPC status example
        shell: pwsh
        run: |
          cargo build --locked -p wiilandd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p wiiland-ipc --example status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke real daemon dry-run and IPC status (no hardware or driver test)
        shell: pwsh
        run: |
          # The Windows client accepts only the current-logon default pipe, so use both defaults.
          $daemon = Join-Path $env:GITHUB_WORKSPACE 'target\debug\wiilandd.exe'
          $statusClient = Join-Path $env:GITHUB_WORKSPACE 'target\debug\examples\status.exe'
          $daemonStdout = Join-Path $env:RUNNER_TEMP 'wiilandd-windows-smoke.stdout'
          $daemonStderr = Join-Path $env:RUNNER_TEMP 'wiilandd-windows-smoke.stderr'
          if (-not (Test-Path $daemon)) { throw "Missing daemon executable: $daemon" }
          if (-not (Test-Path $statusClient)) { throw "Missing IPC status client: $statusClient" }

          $daemonProcess = $null
          try {
            $daemonProcess = Start-Process `
              -FilePath $daemon `
              -ArgumentList @('--no-config', '--dry-run') `
              -WorkingDirectory $env:GITHUB_WORKSPACE `
              -PassThru `
              -NoNewWindow `
              -RedirectStandardOutput $daemonStdout `
              -RedirectStandardError $daemonStderr

            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            $statusReady = $false
            while ([DateTime]::UtcNow -lt $deadline) {
              $daemonProcess.Refresh()
              if ($daemonProcess.HasExited) {
                throw "wiilandd exited before Windows IPC status became available (exit $($daemonProcess.ExitCode))"
              }
              $statusLines = @(& $statusClient 2>&1)
              $statusExit = $LASTEXITCODE
              if ($statusExit -eq 0) {
                $statusReady = $true
                break
              }
              Start-Sleep -Milliseconds 100
            }
            if (-not $statusReady) {
              throw "Timed out waiting for wiilandd Windows IPC status; last client exit $statusExit`: $($statusLines -join '; ')"
            }

            $statusText = $statusLines -join "`n"
            $statusLines | Write-Output
            if ($statusText -notmatch '(?m)^daemon_version=\S+$') {
              throw 'IPC status did not return a daemon version'
            }
            if ($statusText -notmatch "(?m)^pid=$($daemonProcess.Id)$") {
              throw 'IPC status PID did not match the running daemon'
            }
            if ($statusText -notmatch '(?m)^device_count=0$') {
              throw 'IPC status did not report zero opened devices'
            }
            if ($statusText -notmatch '(?m)^dry_run=true$') {
              throw 'IPC status did not report dry-run mode'
            }
            if ($statusText -notmatch '(?m)^socket_path=\\\\\.\\pipe\\WiiLand\.S-1-5-5-\d+-\d+\.daemon$') {
              throw 'IPC status did not report the current Windows logon named-pipe endpoint'
            }
            $daemonProcess.Refresh()
            if ($daemonProcess.HasExited) {
              throw "wiilandd exited after replying to IPC status (exit $($daemonProcess.ExitCode))"
            }
            Write-Output 'Smoke scope: daemon dry-run and current-logon named-pipe IPC only; no physical Wii Remote or signed VHF driver test.'
          }
          catch {
            # Do not print account names or SIDs in public CI logs.
            $groups = @(whoami /groups /fo csv /nh | ConvertFrom-Csv -Header Name, Type, SID, Attributes)
            $logonGroups = @($groups | Where-Object { $_.SID -match '^S-1-5-5-\d+-\d+$' })
            Write-Output "Current token logon groups: $($logonGroups.Count)"
            foreach ($group in $logonGroups) {
              Write-Output "Current token logon attributes: $($group.Attributes)"
            }
            if ($logonGroups.Count -eq 1) {
              $pipePath = "\\.\pipe\WiiLand.$($logonGroups[0].SID).daemon"
              try {
                $acl = Get-Acl -LiteralPath $pipePath -ErrorAction Stop
                foreach ($rule in $acl.Access) {
                  Write-Output "Pipe ACE: type=$($rule.AccessControlType) mask=$($rule.FileSystemRights.value__) identity-string-matches-logon=$($rule.IdentityReference.Value -eq $logonGroups[0].SID)"
                }
              } catch {
                Write-Output "Pipe descriptor query unavailable: $($_.Exception.GetType().Name)"
              }
            }
            if ($daemonProcess) {
              $daemonProcess.Refresh()
              if (-not $daemonProcess.HasExited) {
                Stop-Process -Id $daemonProcess.Id -Force -ErrorAction SilentlyContinue
                $daemonProcess.WaitForExit()
              }
            }
            if (Test-Path $daemonStdout) { Get-Content $daemonStdout }
            if (Test-Path $daemonStderr) { Get-Content $daemonStderr }
            throw
          }
          finally {
            if ($daemonProcess) {
              $daemonProcess.Refresh()
              if (-not $daemonProcess.HasExited) {
                Stop-Process -Id $daemonProcess.Id -Force -ErrorAction SilentlyContinue
                $daemonProcess.WaitForExit()
              }
            }
          }
